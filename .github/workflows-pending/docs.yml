# Markdown lint (error) and link check (warn) — REPO_SKELETON.md §6.1, §8.2.
#
# The design corpus is the primary artefact of this repo right now, so broken links in it are
# a real cost. They are a warning rather than an error because external links rot for reasons
# that are not our fault and should not block a commit.

name: docs

on:
  push:
    branches: [main]
    paths: ['**/*.md', '.markdownlint.jsonc', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**/*.md', '.markdownlint.jsonc']
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:md

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 '**/*.md'
          fail: true

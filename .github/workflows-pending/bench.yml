# CV micro-benchmarks with a regression gate (REPO_SKELETON.md §5.6).
#
# This is the cheap half of performance testing. The half that actually decides whether the
# product is viable — Dota's 1% low frame time with Riki running — cannot run on a CI runner
# and lives in bench/frametime as a manual release gate.

name: bench

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/cv/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bench/cv/**'
  workflow_dispatch:

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Restore baseline from main
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ github.sha }}
          restore-keys: criterion-${{ runner.os }}-

      - name: Run benchmarks
        run: cargo bench --workspace -- --save-baseline current

      # Criterion exits non-zero on a regression beyond its noise threshold once a baseline
      # exists. Until crates/riki-cv has benchmarks this job is a no-op that still proves the
      # toolchain works.
      - name: Upload criterion report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: ignore

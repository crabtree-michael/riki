[package]
name = "riki-capture"
description = "Screen capture: ScreenCaptureKit (macOS), PipeWire portal (Linux), WGC (Windows); GPU crop, downscale, region hashing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The overlay window's document.

      No network, no remote content, no inline script — the renderer is the least privileged
      process in the app, and this policy is the second half of `sandbox: true` and
      `contextIsolation: true` in the window configuration (overlay-architecture.md §6.2).

      `index.js` is this directory's compiled `index.ts`. The build that emits it, and the app
      entry that points a BrowserWindow here, belong to the apps/desktop shell — see the header of
      index.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Riki</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="riki-root" id="riki-root"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>

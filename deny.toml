# cargo-deny: licences, advisories, and duplicate versions (REPO_SKELETON.md §6.1).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive only. Nothing copyleft ships inside a distributed binary without a decision,
# and that decision would be an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Our own crates are `publish = false` and carry `license = "UNLICENSED"`, which is not a
# valid SPDX expression — without this, cargo-deny fails on the four workspace members
# before it ever looks at a dependency. The allow-list above is about what we *ship*.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Local git hooks (REPO_SKELETON.md §6.1). Installed by `pnpm setup`.
#
# Pre-commit stays fast: format and lint only what changed. The full gate is `pnpm check`,
# which is also what CI runs — see §8.1.

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,js,mjs,json,jsonc,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    markdownlint:
      glob: '*.md'
      run: pnpm exec markdownlint-cli2 {staged_files}
    rustfmt:
      glob: '*.rs'
      run: node scripts/cargo.mjs fmt -- {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lfs:
      # `git lfs install` refuses to write this hook because lefthook already owns it, so
      # without this line the frame fixtures (§8.3) push as pointers and the objects never
      # upload. Needs both the hook's argv (remote, url) and its stdin (the ref updates).
      use_stdin: true
      run: git lfs pre-push {1} {2}
    gitleaks:
      # A committed API key is the failure §7.1 is built to prevent; the .gitignore entry
      # is the protection, this is the backstop. Skipped with a notice if not installed.
      run: node scripts/gitleaks.mjs
